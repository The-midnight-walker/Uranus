# ==============================================================================
# Uranus Framework Configuration File
# ==============================================================================
# Notes on syntax and guidelines:
#   - Lines starting with '##' are structural header comments (DO NOT UNCOMMENT).
#   - Lines starting with '#' are configurable settings disabled by default.
#   - Uncomment and adjust settings carefully. Ensure you understand the security
#     implications before modifying values.
# ==============================================================================

##
## DIRECTORY SETTINGS
##

[directories]
## Path to the primary Uranus configuration directory.
## Default: /etc/uranus
#CONFIG_ROOT_DIR=""

##
## LOGGING CONFIGURATION
##

[logging]
## Absolute file path for the system log output.
## Default: /var/log/uranus.log
LOGGING_FILE_PATHNAME = uranus.log

## Minimum severity level for log entries.
## Available levels (from lowest to highest):
##   DEBUG    - Detailed diagnostic info for development.
##   INFO     - Confirmation that things are working as expected.
##   WARNING  - Indication of potential issues or unexpected events.
##   ERROR    - Serious error, a specific task failed.
##   CRITICAL - Fatal error, the application may terminate.
##
## Default: INFO
FILE_LOG_LEVEL = INFO
FILE_LOG_TIMESTAMP=true

CONSOLE_LOG_LEVEL = INFO
CONSOLE_LOG_TIMESTAMP=false
CONSOLE_LOG_COLORED_OUT=true