# ==============================================================================
# Uranus Framework Configuration File
# ==============================================================================
# Notes on syntax and guidelines:
#   - Lines starting with '##' are structural header comments (DO NOT UNCOMMENT).
#   - Lines starting with '#' are configurable settings disabled by default.
#   - Uncomment and adjust settings carefully. Ensure you understand the security
#     implications before modifying values.
# ==============================================================================

## ======================
## GLOBAL SYSTEM POLICIES
## ======================
[users.login]

## /etc/login.defs - Configuration control definitions for the shadow package.

## Directory where mailboxes reside, or name of file relative to home directory
MAIL_DIR = /var/mail
##MAIL_FILE = .mail

## Enable logging of failed login attempts
FAILLOG_ENAB = yes

## Prevent disclosure of unknown usernames in login failure records
LOG_UNKFAIL_ENAB = no

## Enable logging of successful logins
LOG_OK_LOGINS = yes

## Enable syslog logging of su activity
SYSLOG_SU_ENAB = yes

## Enable syslog logging of sg and newgrp activity
SYSLOG_SG_ENAB = yes

## File used to record failed login attempts
FTMP_FILE = /var/log/btmp

##TTYTYPE_FILE = /etc/ttytype

## If defined, file which inhibits all the usual chatter during login sequence
HUSHLOGIN_FILE = .hushlogin
##HUSHLOGIN_FILE = /etc/hushlogins

## The default PATH settings, for superuser and normal users
ENV_SUPATH = PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
ENV_PATH = PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/games:/usr/games

## Terminal permissions for terminals after login
##TTYGROUP = tty
TTYPERM = 0600

## Terminal ERASE and KILL characters
ERASECHAR = 0177
KILLCHAR = 025

## Default umask for newly created files and directories
UMASK = 027

## Mode used by useradd(8) and newusers(8) to set the mode for new home directories
HOME_MODE = 0700

## Password aging controls
PASS_MAX_DAYS = 90
PASS_MIN_DAYS = 14
PASS_WARN_AGE = 7

## Min/max values for automatic UID selection in useradd(8)
UID_MIN = 1000
UID_MAX = 60000
##SYS_UID_MIN = 101
##SYS_UID_MAX = 999
SUB_UID_MIN = 100000
SUB_UID_MAX = 600100000
SUB_UID_COUNT = 65536

## Min/max values for automatic GID selection in groupadd(8)
GID_MIN = 1000
GID_MAX = 60000
##SYS_GID_MIN = 101
##SYS_GID_MAX = 999
SUB_GID_MIN = 100000
SUB_GID_MAX = 600100000
SUB_GID_COUNT = 65536

## Max number of login retries if password is bad
LOGIN_RETRIES = 3

## Max time in seconds for login
LOGIN_TIMEOUT = 60

## Which fields may be changed by regular users using chfn(1)
CHFN_RESTRICT = rwh

## Password encryption method (YESCRYPT, SHA512, etc.)
ENCRYPT_METHOD = YESCRYPT

## Should login be allowed if we can't cd to the home directory?
DEFAULT_HOME = no

## Home directory string for system accounts without a home directory
NONEXISTENT = /nonexistent

## Command run when removing a user
USERDEL_CMD = /usr/sbin/userdel_local

## Remove user group if empty on userdel, and create user group on useradd
USERGROUPS_ENAB = yes

## Prevent empty passwords from bypassing authentication for root
PREVENT_NO_AUTH = superuser

